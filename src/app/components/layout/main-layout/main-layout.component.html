<div class="layout" [class.menu-open]="menuAberto">
  <app-sidebar [aberto]="menuAberto" (navegacao)="fecharMenu()" />
  <main class="main-content">
    <button
      class="mobile-menu-toggle"
      type="button"
      aria-label="Abrir menu de navegação"
      (click)="alternarMenu()"
    >
      <i class="pi pi-bars" aria-hidden="true"></i></button
    ><router-outlet />
  </main>
  <button
    *ngIf="menuAberto"
    class="layout-backdrop"
    type="button"
    aria-label="Fechar menu"
    (click)="fecharMenu()"
  ></button>
</div>
