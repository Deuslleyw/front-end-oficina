<div class="layout" [class.menu-open]="menuAberto">
  <app-sidebar [aberto]="menuAberto" (navegacao)="fecharMenu()" />
  <div class="app-shell">
    <header class="app-topbar">
      <button
        class="mobile-menu-toggle"
        type="button"
        [attr.aria-expanded]="menuAberto"
        aria-controls="navegacao-principal"
        [attr.aria-label]="menuAberto ? 'Fechar menu de navegação' : 'Abrir menu de navegação'"
        (click)="alternarMenu()"
      >
        <i class="pi pi-bars" aria-hidden="true"></i>
      </button>
      <div class="topbar-context" aria-live="polite">
        <span class="topbar-product">OFICINATECH</span>
        <span class="topbar-separator" aria-hidden="true">/</span>
        <strong>{{ tituloPagina }}</strong>
      </div>
      <app-navbar />
    </header>
    <main class="main-content">
      <router-outlet />
    </main>
  </div>
  <button
    *ngIf="menuAberto"
    class="layout-backdrop"
    type="button"
    aria-label="Fechar menu"
    (click)="fecharMenu()"
  ></button>
</div>
