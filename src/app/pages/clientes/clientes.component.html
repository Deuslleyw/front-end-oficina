<section class="clientes-page" aria-labelledby="clientes-title">
  <p-toast /><p-confirmDialog />
  <header class="page-header">
    <div>
      <span class="page-eyebrow">Cadastros</span>
      <h1 id="clientes-title">Clientes</h1>
      <p>Gerencie os clientes da oficina.</p>
    </div>
    <p-button label="Novo cliente" icon="pi pi-plus" (onClick)="abrirNovo()" />
  </header>
  <div class="page-toolbar">
    <label class="search-field" for="busca-clientes"
      ><i class="pi pi-search" aria-hidden="true"></i
      ><input
        id="busca-clientes"
        pInputText
        type="search"
        [(ngModel)]="busca"
        placeholder="Buscar por nome, e-mail ou CPF"
        aria-label="Buscar clientes" /></label
    ><span class="result-count" aria-live="polite"
      >{{ clientesFiltrados.length }}
      {{ clientesFiltrados.length === 1 ? "cliente" : "clientes" }}</span
    >
  </div>
  <div class="table-card">
    <p-table
      [value]="clientesFiltrados"
      [loading]="carregando"
      [paginator]="true"
      [rows]="10"
      styleClass="p-datatable-striped"
      [rowHover]="true"
      responsiveLayout="scroll"
      ><ng-template pTemplate="header">
        <tr>
          <th scope="col">Nome</th>
          <th scope="col">E-mail</th>
          <th scope="col">Telefone</th>
          <th scope="col">CPF</th>
          <th scope="col" class="actions-column">Ações</th>
        </tr> </ng-template
      ><ng-template pTemplate="body" let-cliente>
        <tr>
          <td data-label="Nome">{{ cliente.nome }}</td>
          <td data-label="E-mail">{{ cliente.email }}</td>
          <td data-label="Telefone">{{ cliente.telefone }}</td>
          <td data-label="CPF">{{ cliente.cpf }}</td>
          <td data-label="Ações">
            <div class="acoes">
              <p-button
                icon="pi pi-pencil"
                [rounded]="true"
                [text]="true"
                severity="info"
                aria-label="Editar cliente"
                (onClick)="abrirEdicao(cliente)"
              /><p-button
                icon="pi pi-trash"
                [rounded]="true"
                [text]="true"
                severity="danger"
                aria-label="Excluir cliente"
                (onClick)="confirmarDelete(cliente)"
              />
            </div>
          </td>
        </tr> </ng-template
      ><ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="empty-state">Nenhum cliente encontrado.</td>
        </tr>
      </ng-template></p-table
    >
  </div>
  <p-dialog
    [(visible)]="dialogVisivel"
    [header]="editando ? 'Editar Cliente' : 'Novo Cliente'"
    [modal]="true"
    [style]="{ width: '680px' }"
    [draggable]="false"
    [breakpoints]="{ '640px': '94vw' }"
  >
    <div class="p-fluid form-grid">
      <div class="field">
        <label for="cliente-nome">Nome</label
        ><input
          id="cliente-nome"
          pInputText
          type="text"
          [(ngModel)]="clienteSelecionado.nome"
          autocomplete="name"
        />
      </div>
      <div class="field">
        <label for="cliente-email">E-mail</label
        ><input
          id="cliente-email"
          pInputText
          type="email"
          [(ngModel)]="clienteSelecionado.email"
          autocomplete="email"
        />
      </div>
      <div class="field">
        <label for="cliente-telefone">Telefone</label
        ><input
          id="cliente-telefone"
          pInputText
          type="tel"
          [(ngModel)]="clienteSelecionado.telefone"
          autocomplete="tel"
        />
      </div>
      <div class="field">
        <label for="cliente-cpf">CPF</label
        ><input
          id="cliente-cpf"
          pInputText
          type="text"
          [(ngModel)]="clienteSelecionado.cpf"
          inputmode="numeric"
        />
      </div>
    </div>
    <ng-template pTemplate="footer">
      <div class="dialog-actions">
        <p-button
          label="Cancelar"
          icon="pi pi-times"
          [text]="true"
          severity="secondary"
          (onClick)="dialogVisivel = false"
        /><p-button
          [label]="editando ? 'Atualizar' : 'Salvar'"
          icon="pi pi-check"
          (onClick)="salvar()"
        />
      </div>
    </ng-template>
  </p-dialog>
</section>
