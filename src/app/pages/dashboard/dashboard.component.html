<div class="dashboard">

  <div class="page-header">
    <h2>Dashboard</h2>
    <p>Visão geral do sistema</p>
  </div>

  <div class="cards-grid">

    <div class="summary-card clientes">
      <div class="card-icon">
        <i class="pi pi-users"></i>
      </div>
      <div class="card-info">
        <span class="card-valor">{{ totalClientes }}</span>
        <span class="card-label">Clientes</span>
      </div>
    </div>

    <div class="summary-card veiculos">
      <div class="card-icon">
        <i class="pi pi-car"></i>
      </div>
      <div class="card-info">
        <span class="card-valor">{{ totalVeiculos }}</span>
        <span class="card-label">Veículos</span>
      </div>
    </div>

    <div class="summary-card abertas">
      <div class="card-icon">
        <i class="pi pi-file-edit"></i>
      </div>
      <div class="card-info">
        <span class="card-valor">{{ ordensAbertas }}</span>
        <span class="card-label">Ordens Abertas</span>
      </div>
    </div>

    <div class="summary-card andamento">
      <div class="card-icon">
        <i class="pi pi-spinner"></i>
      </div>
      <div class="card-info">
        <span class="card-valor">{{ ordensEmAndamento }}</span>
        <span class="card-label">Em Andamento</span>
      </div>
    </div>

    <div class="summary-card concluidas">
      <div class="card-icon">
        <i class="pi pi-check-circle"></i>
      </div>
      <div class="card-info">
        <span class="card-valor">{{ ordensConcluidas }}</span>
        <span class="card-label">Concluídas</span>
      </div>
    </div>

    <div class="summary-card canceladas">
      <div class="card-icon">
        <i class="pi pi-times-circle"></i>
      </div>
      <div class="card-info">
        <span class="card-valor">{{ ordensCanceladas }}</span>
        <span class="card-label">Canceladas</span>
      </div>
    </div>

  </div>

</div>
